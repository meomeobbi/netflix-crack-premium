name: NetflixCrackPremium
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  NetflixCrackPremium:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Assets.xcassets
    resources:
      - Sources/Assets.xcassets
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netflix.Netflix
        PRODUCT_NAME: NetflixCrackPremium
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
