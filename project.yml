name: 3105Pro
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  3105Pro:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "3105"
        CFBundleIdentifier: com.troll.uuwsa
        CFBundleName: "3105"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troll.uuwsa
        PRODUCT_NAME: 3105Pro
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
