name: NetflixCrackPremium
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  NetflixCrackPremium:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Netflix NewUpdate
        CFBundleIdentifier: com.netflix.Netflix
        CFBundleName: Netflix NewUpdate
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netflix.Netflix
        PRODUCT_NAME: NetflixCrackPremium
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
