name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project 3105Pro.xcodeproj \
            -scheme 3105Pro \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/3105Pro.app Payload/
          zip -r 3105Pro.ipa Payload
          ls -lh 3105Pro.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105Pro-ipa
          path: 3105Pro.ipa
          if-no-files-found: error
