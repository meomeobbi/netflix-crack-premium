name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project NetflixCrackPremium.xcodeproj \
            -scheme NetflixCrackPremium \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NetflixCrackPremium.app Payload/
          zip -r NetflixCrackPremium.ipa Payload
          ls -lh NetflixCrackPremium.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetflixCrackPremium-ipa
          path: NetflixCrackPremium.ipa
          if-no-files-found: error
